[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-man"
version = "0.1.0"
description = "Recoverable Redis and MongoDB distributed crawling framework"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["crawler", "redis", "mongodb", "distributed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["redis>=5,<7", "pymongo>=4.8,<5", "requests>=2.32,<3"]

[project.urls]
Repository = "https://github.com/cookies886/spider_man"
Issues = "https://github.com/cookies886/spider_man/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "mongomock>=4.3,<5"]
build = ["build>=1.2,<2", "twine>=6,<7"]

[project.scripts]
spider-man = "spider_man.commands.cmdline:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["spider_man", "spider_man.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

